<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bem-estar, do jeito que a natureza pretendia.">
  <title>Cotara - Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="site-fundo" id="site-fundo" aria-hidden="true">
    <video class="hero__img" src="design-references/hero-video.mp4" poster="design-references/hero-video-poster.jpg" muted loop playsinline preload="auto"></video>
    <div class="hero__overlay"></div>
    <div class="hero__veu" id="hero-veu"></div>
  </div>

  <div class="hero-primeiro-plano">
    <div class="hero__content">
      <h1 class="hero__headline">Cotara</h1>
    </div>

    <nav class="pill-nav" aria-label="Navegação principal">
      <button class="pill-nav__item pill-nav__item--cta" type="button" id="cta-sintoma">O que você está sentindo hoje? →</button>
      <button class="pill-nav__item" type="button" data-slug="hormonios">Hormônios</button>
      <button class="pill-nav__item" type="button" data-slug="sono-ansiedade">Sono</button>
      <button class="pill-nav__item" type="button" data-slug="intestino-digestao">Intestino</button>
      <button class="pill-nav__item" type="button" data-slug="imunidade-garganta">Imunidade</button>
    </nav>
  </div>

  <section class="produtos" id="produtos">
    <h2 class="produtos__titulo">Todos os produtos</h2>
    <div class="produtos__lista" id="produtos-grid">
      <!-- preenchido via js/app.js a partir de js/produtos.js -->
    </div>
  </section>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal-sintoma" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" tabindex="-1">
      <button class="modal__fechar" id="modal-fechar" type="button" aria-label="Fechar">×</button>
      <h2 id="modal-titulo" class="modal__titulo">O que você está sentindo hoje?</h2>

      <div class="modal__corpo">
        <div class="wireframe-wrap" id="wireframe-wrap">
          <img class="wireframe__figura" id="wireframe-figura" src="design-references/wireframe-corpo-otimizado.png" alt="Silhueta em wireframe de um corpo humano, usada pra selecionar a região do sintoma" draggable="false">
          <div class="hotspots" id="hotspots"><!-- gerado via js/app.js --></div>
        </div>

        <ul class="sintomas-lista" id="sintomas-lista"><!-- gerado via js/app.js --></ul>
      </div>

      <button class="modal__confirmar" id="modal-confirmar" type="button" disabled>Ver produtos →</button>
    </div>
  </div>

  <div class="modal-overlay" id="produto-overlay" hidden>
    <div class="modal modal--produto" id="produto-modal" role="dialog" aria-modal="true" aria-labelledby="produto-titulo" tabindex="-1">
      <button class="modal__fechar" id="produto-fechar" type="button" aria-label="Fechar">×</button>
      <div class="produto-detalhe">
        <div class="produto-detalhe__img" id="produto-detalhe-img"></div>
        <div class="produto-detalhe__corpo">
          <h2 id="produto-titulo" class="produto-detalhe__nome"></h2>
          <span class="produto-detalhe__preco" id="produto-detalhe-preco"></span>
          <p class="produto-detalhe__desc" id="produto-detalhe-desc"></p>
          <button class="produto-detalhe__desc-toggle" id="produto-detalhe-desc-toggle" type="button" hidden>Ler descrição completa</button>
          <div class="produto-detalhe__acoes">
            <button class="entrada__add" id="produto-detalhe-add" type="button">Adicionar ao carrinho</button>
            <button class="entrada__whats" id="produto-detalhe-whats" type="button">Comprar no WhatsApp</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="cart-fab" id="cart-fab" type="button" aria-label="Ver carrinho">
    🛒<span class="cart-fab__badge" id="cart-badge">0</span>
  </button>

  <div class="cart-overlay" id="cart-overlay" hidden>
    <aside class="cart-painel" id="cart-painel" role="dialog" aria-modal="true" aria-labelledby="cart-titulo" tabindex="-1">
      <div class="cart-painel__cabeca">
        <h2 id="cart-titulo" class="cart-painel__titulo">🛒 Seu carrinho</h2>
        <button class="cart-fechar" id="cart-fechar" type="button" aria-label="Fechar carrinho">×</button>
      </div>

      <div class="cart-itens" id="cart-itens"></div>

      <div class="cart-painel__rodape">
        <div class="cart-linha-total"><span>Total de itens</span><span id="cart-total-itens">0</span></div>
        <div class="cart-linha-total"><span>Total</span><span id="cart-total-valor">R$ 0,00</span></div>
        <button class="cart-checkout" id="cart-checkout" type="button" disabled>Finalizar pedido via WhatsApp</button>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast">✅ Produto adicionado ao carrinho!</div>

  <script src="js/produtos.js"></script>
  <script src="js/areas-corpo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
